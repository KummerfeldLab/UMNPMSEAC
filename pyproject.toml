[project]
name = "UMNPMSEAC"
version = "0.1.0"
description = "Framework for spatial permutation analysis of gene categories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26",
    "polars>=2.0",
]

[project.optional-dependencies]
slurm = ["submitit"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "umnpmseac"
